# Foot terminal configuration
# Similar to Alacritty Linux config

[main]
# Font configuration - matching Alacritty Linux
font=Meslo LGM Nerd Font:size=14

# Terminal settings
term=xterm-256color
# title=foot
# app-id=foot

# Scrollback
scrollback-lines=10000

# Mouse
mouse-hide-when-typing=yes

# Initial window size (matching Alacritty)
initial-window-size-chars=164x36

# Padding (matching Alacritty: x=4, y=4)
pad=4x4

[bell]
urgent=no
notify=no

[cursor]
# Block cursor, no blinking (matching Alacritty)
style=block
blink=no

[colors]
# Nord color scheme (matching Alacritty Nord theme)
alpha=0.8

# Default colors
background=2E3440
foreground=D8DEE9

# Normal colors
regular0=3B4252  # black
regular1=BF616A  # red
regular2=A3BE8C  # green
regular3=EBCB8B  # yellow
regular4=81A1C1  # blue
regular5=B48EAD  # magenta
regular6=88C0D0  # cyan
regular7=E5E9F0  # white

# Bright colors
bright0=4C566A   # black
bright1=BF616A   # red
bright2=A3BE8C   # green
bright3=EBCB8B   # yellow
bright4=81A1C1   # blue
bright5=B48EAD   # magenta
bright6=8FBCBB   # cyan
bright7=ECEFF4   # white

[key-bindings]
# Scrolling
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-line=Control+Shift+Up
scrollback-down-line=Control+Shift+Down
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End

# Font size
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

# Copy/Paste
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
primary-paste=Shift+Insert

# URL selection
show-urls-launch=Control+Shift+u
show-urls-copy=Control+Shift+o

# Search
search-start=Control+Shift+f

[search-bindings]
# Search mode bindings
find-next=Control+g
find-prev=Control+Shift+g
cancel=Control+g Control+c Escape

[mouse-bindings]
# Mouse button bindings
selection-override-modifiers=Shift
primary-paste=BTN_MIDDLE
select-begin=BTN_LEFT
select-begin-block=Control+BTN_LEFT
select-extend=BTN_RIGHT
select-extend-character-wise=Control+BTN_RIGHT
